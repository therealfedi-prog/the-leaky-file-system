<!DOCTYPE html>
<html>
<head>
    <title>File Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f0f0f0;
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
        
        .info {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .upload-box {
            background: white;
            border: 3px dashed #ccc;
            padding: 50px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .upload-box:hover {
            border-color: #007bff;
            background: #f9f9f9;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            background: #007bff;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .btn:hover {
            background: #0056b3;
        }
        
        .message {
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .files-list {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
        }
        
        .file-item {
            background: #f5f5f5;
            padding: 12px;
            margin: 8px 0;
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        
        .no-files {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1>📁 File Upload System</h1>
    
    <div class="info">
        <strong>Requirements:</strong>
        <ul>
            <li>Only images allowed (JPG, PNG, GIF, WebP)</li>
            <li>Maximum size: 5MB</li>
            <li>Files auto-delete after 24 hours</li>
            <li>Duplicates are automatically detected</li>
        </ul>
    </div>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p style="font-size: 50px; margin: 0;">📤</p>
        <p style="font-size: 18px; color: #333;">Click here to upload a file</p>
        <p style="color: #666;">or drag and drop</p>
        <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/gif,image/webp">
    </div>
    
    <div id="message" class="message"></div>
    
    <div class="files-list">
        <h2>Uploaded Files</h2>
        <div id="filesList">
            <p class="no-files">No files uploaded yet</p>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const message = document.getElementById('message');
        const filesList = document.getElementById('filesList');
        const uploadBox = document.querySelector('.upload-box');
        
        // File input change
        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                uploadFile(this.files[0]);
            }
        });
        
        // Drag and drop
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#007bff';
        });
        
        uploadBox.addEventListener('dragleave', () => {
            uploadBox.style.borderColor = '#ccc';
        });
        
        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#ccc';
            if (e.dataTransfer.files.length > 0) {
                uploadFile(e.dataTransfer.files[0]);
            }
        });
        
        // Upload function
        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            // Show uploading message
            showMessage('Uploading...', 'success');
            
            fetch('http://localhost:5001/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage(data.message, 'success');
                    loadFiles();
                    fileInput.value = '';
                } else {
                    showMessage(data.message, 'error');
                }
            })
            .catch(error => {
                showMessage('Error: ' + error, 'error');
            });
        }
        
        // Show message
        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            message.style.display = 'block';
            
            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }
        
        // Load files list
        function loadFiles() {
            fetch('http://localhost:5001/files')
                .then(response => response.json())
                .then(data => {
                    if (data.files.length === 0) {
                        filesList.innerHTML = '<p class="no-files">No files uploaded yet</p>';
                        return;
                    }
                    
                    filesList.innerHTML = '';
                    data.files.forEach(file => {
                        const fileDiv = document.createElement('div');
                        fileDiv.className = 'file-item';
                        
                        const sizeKB = (file.size / 1024).toFixed(1);
                        
                        fileDiv.innerHTML = `
                            <strong>📄 ${file.original_name}</strong><br>
                            <small>Size: ${sizeKB} KB | Uploaded: ${new Date(file.uploaded_at).toLocaleString()}</small>
                        `;
                        
                        filesList.appendChild(fileDiv);
                    });
                })
                .catch(error => {
                    console.error('Error loading files:', error);
                });
        }
        
        // Load files on page load
        loadFiles();
    </script>
</body>
</html>
